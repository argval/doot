name: doot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doot
      POSTGRES_PASSWORD: doot
      POSTGRES_DB: doot
    ports:
      - "5432:5432"
    volumes:
      - doot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doot -d doot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  doot-postgres:
