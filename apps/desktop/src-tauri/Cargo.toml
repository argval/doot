[package]
name = "doot"
version = "0.1.0"
description = "Native audio engine for Doot"
authors = ["Doot"]
edition = "2021"

[lib]
name = "doot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6.2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
