[package]
name = "doot"
version = "0.1.0"
description = "Native audio engine for Doot"
authors = ["Doot"]
edition = "2021"

[lib]
name = "doot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
base64 = "0.23.1"
crossbeam-queue = "0.3.13"
futures-util = { version = "0.3.33", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6.2", features = ["macos-private-api", "tray-icon"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["sync", "time", "net", "rt", "macros", "io-util"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-store = "=2.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "=2.2.0"
tauri-plugin-window-state = "=2.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }
